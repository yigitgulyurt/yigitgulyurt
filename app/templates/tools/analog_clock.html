{% extends "base/base.html" %}

{% block title %}Analog Saat{% endblock %}

{% block head %}
<style>
.tool-container {
    max-width: 600px;
    margin: 40px auto;
    padding: 30px;
    background: var(--card-bg);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    text-align: center;
}

.clock {
    width: 300px;
    height: 300px;
    border: 8px solid var(--primary);
    border-radius: 50%;
    margin: 20px auto;
    position: relative;
    background: rgba(0, 0, 0, 0.3);
    box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.3);
}

.clock-face {
    width: 100%;
    height: 100%;
    position: relative;
}

.clock-face::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    background: var(--primary);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
}

.hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 4px;
}

.hour-hand {
    width: 6px;
    height: 80px;
    background: var(--text);
    margin-left: -3px;
}

.minute-hand {
    width: 4px;
    height: 110px;
    background: var(--text-dim);
    margin-left: -2px;
}

.second-hand {
    width: 2px;
    height: 120px;
    background: var(--primary);
    margin-left: -1px;
}

.clock-number {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-weight: bold;
    font-size: 1.2rem;
    color: var(--text);
}

.number-12 { top: 10px; left: 50%; transform: translateX(-50%); }
.number-3 { right: 15px; top: 50%; transform: translateY(-50%); }
.number-6 { bottom: 10px; left: 50%; transform: translateX(-50%); }
.number-9 { left: 15px; top: 50%; transform: translateY(-50%); }
</style>
{% endblock %}

{% block content %}
<div class="tool-container">
    <h1 class="tool-title">
        <span class="lang-tr">⏰ Analog Saat</span>
        <span class="lang-en">⏰ Analog Clock</span>
    </h1>
    
    <div class="clock">
        <div class="clock-face">
            <div class="clock-number number-12">12</div>
            <div class="clock-number number-3">3</div>
            <div class="clock-number number-6">6</div>
            <div class="clock-number number-9">9</div>
            <div class="hand hour-hand" id="hour-hand"></div>
            <div class="hand minute-hand" id="minute-hand"></div>
            <div class="hand second-hand" id="second-hand"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function setClock() {
    const now = new Date();
    const seconds = now.getSeconds();
    const minutes = now.getMinutes();
    const hours = now.getHours();
    
    const secondDegrees = seconds * 6;
    const minuteDegrees = minutes * 6 + seconds * 0.1;
    const hourDegrees = (hours % 12) * 30 + minutes * 0.5;
    
    document.getElementById('second-hand').style.transform = `rotate(${secondDegrees}deg)`;
    document.getElementById('minute-hand').style.transform = `rotate(${minuteDegrees}deg)`;
    document.getElementById('hour-hand').style.transform = `rotate(${hourDegrees}deg)`;
}

setClock();
setInterval(setClock, 1000);
</script>
{% endblock %}
