{% extends "base/base.html" %}

{% block title %}Sıcaklık Dönüştürücü{% endblock %}

{% block head %}
<style>
.tool-container {
    max-width: 700px;
    margin: 40px auto;
    padding: 30px;
    background: var(--card-bg);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.temp-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
}

.temp-box {
    display: flex;
    flex-direction: column;
}

.temp-box label {
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: bold;
}

.temp-box input {
    padding: 14px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.2rem;
}
</style>
{% endblock %}

{% block content %}
<div class="tool-container">
    <h1 class="tool-title">
        <span class="lang-tr">🌡️ Sıcaklık Dönüştürücü</span>
        <span class="lang-en">🌡️ Temperature Converter</span>
    </h1>
    
    <div class="temp-inputs">
        <div class="temp-box">
            <label>°C</label>
            <input type="number" id="celsius" oninput="convertFromCelsius()">
        </div>
        <div class="temp-box">
            <label>°F</label>
            <input type="number" id="fahrenheit" oninput="convertFromFahrenheit()">
        </div>
        <div class="temp-box">
            <label>K</label>
            <input type="number" id="kelvin" oninput="convertFromKelvin()">
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function convertFromCelsius() {
    const c = parseFloat(document.getElementById('celsius').value);
    if (isNaN(c)) return;
    
    document.getElementById('fahrenheit').value = Math.round((c * 9/5) + 32);
    document.getElementById('kelvin').value = Math.round(c + 273.15);
}

function convertFromFahrenheit() {
    const f = parseFloat(document.getElementById('fahrenheit').value);
    if (isNaN(f)) return;
    
    const c = (f - 32) * 5/9;
    document.getElementById('celsius').value = Math.round(c);
    document.getElementById('kelvin').value = Math.round(c + 273.15);
}

function convertFromKelvin() {
    const k = parseFloat(document.getElementById('kelvin').value);
    if (isNaN(k)) return;
    
    const c = k - 273.15;
    document.getElementById('celsius').value = Math.round(c);
    document.getElementById('fahrenheit').value = Math.round((c * 9/5) + 32);
}
</script>
{% endblock %}
